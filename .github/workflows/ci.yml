name: CI & Build XPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax check
        run: npm run check

      - name: Run unit and integration tests
        run: npm test

      - name: Build and verify XPI
        run: python scripts/build_xpi.py

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailLedger-xpi
          path: dist/MailLedger.xpi

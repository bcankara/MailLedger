<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mail Tarihçe Günlüğü</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-shell">
    <header class="popup-header">
      <div class="popup-brand">
        <img src="../icons/icon.svg" alt="" width="24" height="24" />
        <div>
          <h1>Mail Tarihçe Günlüğü</h1>
          <span class="popup-subtitle">Son silinen mailler</span>
        </div>
      </div>
      <button id="btn-open-full-top" type="button" class="btn btn-primary btn-xs">
        Tam Panel
      </button>
    </header>

    <section class="mini-stats" aria-label="Özet">
      <div class="mini-stat stat-amber">
        <span class="mini-stat-label">Çöp Kutusu</span>
        <strong id="stat-trashed" class="mini-stat-val">0</strong>
      </div>
      <div class="mini-stat stat-red">
        <span class="mini-stat-label">Bugün Silinen</span>
        <strong id="stat-today" class="mini-stat-val">0</strong>
      </div>
      <div class="mini-stat">
        <span class="mini-stat-label">Toplam Kayıt</span>
        <strong id="stat-total" class="mini-stat-val">0</strong>
      </div>
    </section>

    <div class="popup-search-wrap">
      <input
        id="popup-search"
        type="search"
        placeholder="Silinen maillerde hızlı ara..."
        autocomplete="off"
      />
    </div>

    <div id="popup-status-msg" class="popup-status hidden" role="status"></div>

    <main class="popup-list-wrap">
      <ul id="popup-list" class="popup-list"></ul>
      <div id="popup-empty" class="popup-empty hidden">
        <p id="popup-empty-text">Henüz silinen mail kaydı yok.</p>
      </div>
    </main>

    <footer class="popup-footer">
      <button id="btn-open-dashboard" type="button" class="btn btn-primary btn-sm">
        Tam Arayüzü Aç
      </button>
      <button id="btn-open-settings" type="button" class="btn btn-secondary btn-sm">
        Ayarlar
      </button>
    </footer>
  </div>

  <script src="../src/store.js"></script>
  <script src="../src/mailActions.js"></script>
  <script src="popup.js"></script>
</body>
</html>

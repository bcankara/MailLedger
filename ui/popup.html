<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="extensionName">MailLedger</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popover">
    <header class="popover-header">
      <div class="brand-lockup">
        <img src="../icons/icon.svg" alt="" width="20" height="20" />
        <span class="brand-name" data-i18n="extensionName">MailLedger</span>
      </div>
      <span id="popup-metrics" class="metric-line">0 trash · 0 today · 0 total</span>
    </header>

    <div class="search-strip">
      <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M10.7 10.7L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <input
        id="popup-search"
        type="search"
        data-i18n-placeholder="popupSearchPlaceholder"
        placeholder="Filter deleted messages..."
        autocomplete="off"
      />
    </div>

    <div id="popup-status-msg" class="status-banner hidden" role="status"></div>

    <main class="list-viewport">
      <ul id="popup-list" class="mail-list"></ul>
      <div id="popup-empty" class="empty-block hidden">
        <p id="popup-empty-text" data-i18n="popupEmptyDefault">
          No deleted mail recorded yet. Deleted messages appear here immediately sorted by deletion time.
        </p>
      </div>
    </main>

    <footer class="popover-footer">
      <button id="btn-open-dashboard" type="button" class="btn btn-primary" data-i18n="btnOpenFullDashboard">
        Open MailLedger
      </button>
      <button id="btn-open-settings" type="button" class="btn btn-ghost" data-i18n="navSettings">
        Settings
      </button>
    </footer>
  </div>

  <script src="../src/i18n.js"></script>
  <script src="../src/store.js"></script>
  <script src="../src/mailActions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
